<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Blog</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Lora:ital@1&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    background:#fff;
    font-family:'Open Sans',Helvetica,Arial,sans-serif;
    color:#444;
  }

  /* strip abu-abu di atas */
  .topbar{
    height:70px;
    background:#f5f5f5;
  }

  .container{
    max-width:1000px;
    margin:0 auto;
    padding:0 30px 60px;
  }

  h1{
    text-align:center;
    font-size:72px;
    font-weight:700;
    color:#444;
    margin:40px 0 0 0;
    letter-spacing:-1px;
    line-height:1.2;
  }
  /* garis pendek di tengah bawah judul */
  h1::after{
    content:"";
    display:block;
    width:135px;
    height:3px;
    background:#444;
    margin:8px auto 0;
  }

  .box{
    background:#f4f4f4;
    border:1px solid #f0f0f0;
    border-radius:3px;
    padding:28px 26px;
    font-weight:700;
    font-size:20px;
    color:#333;
    margin:50px 0 60px 0;
  }

  h2{
    font-size:32px;
    font-weight:700;
    color:#333;
    margin:0 0 10px 0;
  }

  .meta{
    font-family:'Lora',Georgia,serif;
    font-style:italic;
    font-size:17px;
    color:#777;
    margin:0 0 14px 0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .meta svg{width:16px;height:16px;fill:#777;flex:none}

  .desc{
    font-size:18px;
    font-weight:400;
    color:#555;
    margin-bottom:14px;
    line-height:1.5;
  }

  .footer-line{
    font-size:16px;
    color:#aaa;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .footer-line a{
    color:#2196f3;
    text-decoration:none;
    margin-left:14px;
  }
  .more{color:#333;font-weight:700;font-size:16px}
</style>
</head>
<body>

<div class="topbar"></div>

<div class="container">
  <h1>DevOps Blog</h1>

  <div class="box">Start DevOps journey now!</div>

  <h2>First Kubernetes Deployment</h2>

  <div class="meta">

  </div>

  <div class="footer-line">

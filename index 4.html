    vertical-align:-1px;
    margin-right:4px;
  }

  .desc{
    font-size:16px;
    font-weight:400;
    color:#777;
    margin-bottom:2px;
    line-height:1.5;
  }

  .footer-line{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    font-size:14px;
    color:#ccc;
  }
  .tags{margin-top:7px}
  .tags a{
    color:#9fc3e0;
    text-decoration:none;
    margin-left:14px;
  }
  .more{
    color:#222;
    font-weight:700;
    font-size:16px;
  }

  footer{
    text-align:center;
    font-size:14px;
    color:#bbb;
    margin-top:100px;
